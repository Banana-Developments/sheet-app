<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <link rel="manifest" href="manifest.json">
  <title>Учёт данных</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 460px; margin: 0 auto; padding: 16px; background: #f8f9fa; color: #202124; }
    h2 { margin-top: 0; font-size: 20px; }
    label { display: block; font-size: 13px; color: #5f6368; margin-top: 12px; margin-bottom: 4px; }
    select, input, button { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #dadce0; box-sizing: border-box; background: #fff; }
    button { background: #1a73e8; color: #fff; border: none; font-weight: 600; margin-top: 16px; cursor: pointer; }
    button:active { opacity: 0.85; }
    button.secondary { background: #e8eaed; color: #202124; font-weight: 500; margin-top: 10px; }
    .row { display: flex; gap: 8px; }
    .row button { margin-top: 10px; }
    .status { margin-top: 16px; padding: 12px; border-radius: 8px; background: #fff; border: 1px solid #e0e0e0; font-size: 14px; line-height: 1.4; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .online { background: #e6f4ea; color: #137333; }
    .offline { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Новая запись</h2>
    <span id="net-badge" class="badge online">Онлайн</span>
  </div>

  <label for="item">Позиция из справочника</label>
  <select id="item">
    <option value="">Загрузка списка...</option>
  </select>

  <label for="amount">Количество / число</label>
  <input type="number" id="amount" step="any" inputmode="decimal" placeholder="Например: 15.5">

  <label for="comment">Комментарий (необязательно)</label>
  <input type="text" id="comment" placeholder="Примечание">

  <button onclick="saveAndSend()">Сохранить и отправить</button>

  <div class="row">
    <button class="secondary" onclick="syncQueue()">Доотправить (<span id="queue-count">0</span>)</button>
    <button class="secondary" onclick="loadCatalog(true)">Обновить список</button>
  </div>

  <div class="status" id="status">Готово к работе.</div>

  <script>
    // ВСТАВЬТЕ ВАШ URL НИЖЕ:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzI6_UvIu5PDdWP3y3B-QFMSrmkZeALEJkqdBXJToHSM5dcLjYlPCwuF1o1wB-7T6Og/exec";
    const TOKEN = "12345";

    const QUEUE_KEY = "sheet_app_queue_v1";
    const CATALOG_KEY = "sheet_app_catalog_v1";

    // Генератор уникального ID для защиты от дублей
    function generateId() {
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    function updateNetBadge() {
      const badge = document.getElementById("net-badge");
      if (navigator.onLine) {
        badge.textContent = "Онлайн";
        badge.className = "badge online";
      } else {
        badge.textContent = "Офлайн";
        badge.className = "badge offline";
      }
    }

    // Работа со справочником (выпадающий список)
    function renderCatalog(items) {
      const select = document.getElementById("item");
      const currentVal = select.value;
      select.innerHTML = "";

      if (!items || items.length === 0) {
        select.innerHTML = '<option value="">Список пуст (нажмите «Обновить список»)</option>';
        return;
      }

      items.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });

      if (items.includes(currentVal)) select.value = currentVal;
    }

    async function loadCatalog(manual = false) {
      // Сначала сразу рисуем из кэша телефона (работает без интернета)
      const cached = JSON.parse(localStorage.getItem(CATALOG_KEY) || "[]");
      if (cached.length > 0) renderCatalog(cached);

      if (!navigator.onLine) {
        if (manual) setStatus("Нет интернета. Используется сохранённый список.");
        return;
      }

      if (manual) setStatus("Обновляем справочник из таблицы...");
      try {
        const url = `${SCRIPT_URL}?token=${encodeURIComponent(TOKEN)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.status === "ok" && Array.isArray(data.items)) {
          localStorage.setItem(CATALOG_KEY, JSON.stringify(data.items));
          renderCatalog(data.items);
          if (manual) setStatus(`Справочник обновлён (${data.items.length} поз.).`);
        } else if (manual) {
          setStatus("Ошибка обновления списка: проверьте токен и URL.");
        }
      } catch (e) {
        if (manual) setStatus("Не удалось загрузить справочник (ошибка сети).");
      }
    }

    // Работа с очередью отправки
    function getQueue() {
      return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
    }

    function setQueue(q) {
      localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
      document.getElementById("queue-count").textContent = q.length;
    }

    function saveAndSend() {
      const item = document.getElementById("item").value;
      const amount = document.getElementById("amount").value.trim();
      const comment = document.getElementById("comment").value.trim();

      if (!item) {
        setStatus("Выберите позицию из списка.");
        return;
      }
      if (amount === "") {
        setStatus("Введите число.");
        return;
      }

      const record = {
        id: generateId(),
        token: TOKEN,
        createdAt: new Date().toLocaleString("ru-RU"),
        item: item,
        amount: parseFloat(amount),
        comment: comment
      };

      const queue = getQueue();
      queue.push(record);
      setQueue(queue);

      document.getElementById("amount").value = "";
      document.getElementById("comment").value = "";
      setStatus("Запись сохранена в память телефона...");
      syncQueue();
    }

    let isSyncing = false;
    async function syncQueue() {
      if (isSyncing) return;
      const queue = getQueue();
      if (queue.length === 0) {
        setStatus("Все записи отправлены.");
        return;
      }
      if (!navigator.onLine) {
        setStatus(`Нет сети. В очереди на отправку: ${queue.length} шт.`);
        return;
      }

      isSyncing = true;
      setStatus(`Отправка в таблицу (${queue.length} шт.)...`);
      const remaining = [];

      for (const record of queue) {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(record)
          });
          const result = await res.json();
          if (result.status !== "ok") remaining.push(record);
        } catch (err) {
          remaining.push(record);
        }
      }

      setQueue(remaining);
      isSyncing = false;

      if (remaining.length === 0) {
        setStatus("Успешно отправлено в Google Таблицу!");
      } else {
        setStatus(`Не удалось отправить: ${remaining.length} шт. Остались в очереди.`);
      }
    }

    // Регистрация Service Worker для офлайн-открытия страницы
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    window.addEventListener("online", () => { updateNetBadge(); syncQueue(); loadCatalog(false); });
    window.addEventListener("offline", updateNetBadge);

    updateNetBadge();
    setQueue(getQueue());
    loadCatalog(false);
    syncQueue();
  </script>
</body>
</html>
